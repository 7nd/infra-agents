# Ключи под конкретные existingSecretKey чарта (glitchtip.database/valkey/
# secretKey secrets, см. values чарта) — один Secret на все три, чтобы не
# плодить объекты.
apiVersion: v1
kind: Secret
metadata:
  name: glitchtip-credentials
  namespace: agents
stringData:
  SECRET_KEY: ${glitchtip_secret_key}
  DATABASE_URL: postgresql://postgres:${postgres_admin_password}@postgres.agents.svc.cluster.local:5432/glitchtip
  REDIS_URL: redis://:${valkey_password}@valkey.agents.svc.cluster.local:6379/1
