# Заглушка перед SOPS-шифрованием — см. .sops.yaml и docs в repo README.
# Сгенерированные пароли/ключи (postgres/valkey/qdrant/n8n/glitchtip/penpot/
# forgejo admin) — реальные значения, сгенерированы один раз при первом
# деплое стенда. forgejo_bot_token, forgejo_actions_runner_secret,
# glitchtip_mcp_token, llm_api_key, llm_api_base_url — настоящий chicken-egg:
# их можно получить только после того, как соответствующий сервис уже поднят
# (или пока нет реального LLM-ключа от пользователя), заполняются позже через
# `sops --set` (тот же приём, что registry_password в unitum-demo-k8s-infra).
# forgejo_actions_runner_secret изначально пытался завести оффлайн-регистрацией
# (`forgejo-cli actions register --secret`, выбранное самим значение) — не
# сработало вживую (раннер получал "runner registration token not found"
# несмотря на успешный ответ CLI), реально рабочий путь —
# `forgejo-cli actions generate-runner-token` после первого поднятия.
