# Тот же приём, что registry/pull-secret.yaml в unitum-demo-k8s-infra —
# registry_username/registry_password приходят из ЕЁ cluster-vars/
# cluster-secrets (см. postBuild.substituteFrom Kustomization
# infrastructure-agents-stack в clusters/demo/infrastructure.yaml того
# репозитория — переиспользует существующий приватный registry вместо
# заведения отдельного.
apiVersion: v1
kind: Secret
metadata:
  name: registry-pull-secret
  namespace: agents
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"registry.${base_domain}":{"username":"${registry_username}","password":"${registry_password}"}}}
