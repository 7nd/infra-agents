# Кастомный образ (см. images/glitchtip-mcp/Dockerfile), собран и запушен в
# приватный registry.${base_domain} вручную (одноразово, не через CI) —
# supergateway + glitchtip-mcp (npm), SSE-режим на 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-mcp
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glitchtip-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glitchtip-mcp
    spec:
      nodeSelector:
        node-group: agents
      imagePullSecrets:
        - name: registry-pull-secret
      containers:
        - name: glitchtip-mcp
          image: registry.${base_domain}/glitchtip-mcp:latest
          envFrom:
            - secretRef:
                name: glitchtip-mcp-credentials
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: glitchtip-mcp
  namespace: agents
spec:
  selector:
    app.kubernetes.io/name: glitchtip-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
