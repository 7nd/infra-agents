# glitchtip_mcp_token — API-токен бота в GlitchTip, chicken-egg (создаётся
# только после того, как GlitchTip уже поднят), заполняется позже через
# `sops --set` (см. README).
#
# GLITCHTIP_BASE_URL — internal Service (glitchtip-web:80), а не внешний
# https://glitchtip.agents.${base_domain}: внутрикластерный вызов не должен
# зависеть от внешнего DNS/Cloudflare/TLS.
apiVersion: v1
kind: Secret
metadata:
  name: glitchtip-mcp-credentials
  namespace: agents
stringData:
  GLITCHTIP_BASE_URL: http://glitchtip-web.agents.svc.cluster.local
  GLITCHTIP_ORGANIZATION: ${glitchtip_organization}
  GLITCHTIP_TOKEN: ${glitchtip_mcp_token}
