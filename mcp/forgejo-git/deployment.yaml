# ronmi/forgejo-mcp (community, активно используется — проверено по свежим
# pull'ам на Docker Hub), встроенный HTTP-режим (не нужен отдельный
# supergateway-обёртка, в отличие от GlitchTip MCP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-mcp
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-mcp
    spec:
      nodeSelector:
        node-group: agents
      containers:
        - name: forgejo-mcp
          image: ronmi/forgejo-mcp:latest
          args:
            - "http"
            - "--address"
            - ":8080"
            - "--server"
            - "https://forgejo.agents.${base_domain}"
          env:
            - name: FORGEJOMCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-mcp-credentials
                  key: FORGEJOMCP_TOKEN
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-mcp
  namespace: agents
spec:
  selector:
    app.kubernetes.io/name: forgejo-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
