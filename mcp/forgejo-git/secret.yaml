# FORGEJOMCP_TOKEN — Personal Access Token бота ${forgejo_admin_username},
# сгенерированный через живой Forgejo API/CLI после первого поднятия
# (chicken-egg, см. README) и занесённый сюда через `sops --set` уже после
# bootstrap-шага. Пустая строка — валидный placeholder до этого момента,
# просто под не пройдёт readiness, пока значение не появится.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-mcp-credentials
  namespace: agents
stringData:
  FORGEJOMCP_TOKEN: ${forgejo_bot_token}
