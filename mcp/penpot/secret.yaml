# penpot_mcp_token — Access Token аккаунта devops@hightps.online (Settings →
# Access Tokens), сгенерирован после того, как enable-access-tokens уже
# раскатан (chicken-egg, тот же приём, что glitchtip_mcp_token/
# forgejo_bot_token) и занесён сюда через `sops --set`.
#
# PENPOT_API_URL — internal Service (penpot-backend:6060), а не внешний
# https://penpot.agents.${base_domain}: внутрикластерный вызов не должен
# зависеть от внешнего DNS/Cloudflare/TLS (тот же приём, что у остальных
# mcp/*).
apiVersion: v1
kind: Secret
metadata:
  name: penpot-mcp-credentials
  namespace: agents
stringData:
  PENPOT_API_URL: http://penpot-backend.agents.svc.cluster.local:6060
  PENPOT_ACCESS_TOKEN: ${penpot_mcp_token}
