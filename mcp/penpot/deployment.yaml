# zcube/penpot-mcp-server (community, публикует готовый multi-arch образ на
# GHCR — тот же резон выбора, что у ronmi/forgejo-mcp: встроенный HTTP-режим,
# не нужен supergateway-обёртка, в отличие от GlitchTip MCP). Headless,
# REST API + Access Token — не официальный @penpot/mcp (тот требует открытый
# Penpot в браузере с установленным плагином, не подходит для
# автоматизации/ops-агента).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-mcp
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penpot-mcp
    spec:
      nodeSelector:
        node-group: agents
      containers:
        - name: penpot-mcp
          image: ghcr.io/zcube/penpot-mcp-server:latest
          env:
            - name: TRANSPORT
              value: http
            - name: HTTP_HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: "8080"
            - name: PENPOT_API_URL
              valueFrom:
                secretKeyRef:
                  name: penpot-mcp-credentials
                  key: PENPOT_API_URL
            - name: PENPOT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: penpot-mcp-credentials
                  key: PENPOT_ACCESS_TOKEN
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-mcp
  namespace: agents
spec:
  selector:
    app.kubernetes.io/name: penpot-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
