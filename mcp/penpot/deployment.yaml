# zcube/penpot-mcp-server (@zcubekr/penpot-mcp-server на npm) — community,
# headless REST API + Access Token, встроенный HTTP-режим (не нужна
# supergateway-обёртка, в отличие от GlitchTip MCP). Не официальный
# @penpot/mcp — тот требует открытый Penpot в браузере с установленным
# плагином, не подходит для автоматизации/ops-агента.
#
# ghcr.io/zcube/penpot-mcp-server НЕ существует (проверено: 403 на anon
# token, страница пакета 404) — судя по всему, автор задокументировал
# образ, который так и не запушил. Готового Docker-образа под этот пакет
# нет нигде, поэтому вместо кастомной сборки (как images/glitchtip-mcp) —
# стоковый node:20-alpine, ставит пакет из npm прямо при старте пода.
# Дороже холодного старта (npm install при каждом рестарте), но не требует
# docker build/push (локально Docker недоступен) — если станет заметной
# проблемой, перейти на images/penpot-mcp/Dockerfile по образцу
# images/glitchtip-mcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-mcp
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penpot-mcp
    spec:
      nodeSelector:
        node-group: agents
      containers:
        - name: penpot-mcp
          image: node:20-alpine
          command:
            - sh
            - -c
            - npm install -g @zcubekr/penpot-mcp-server@1.0.0 && exec penpot-mcp-server
          env:
            - name: TRANSPORT
              value: http
            - name: HTTP_HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: "8080"
            - name: PENPOT_API_URL
              valueFrom:
                secretKeyRef:
                  name: penpot-mcp-credentials
                  key: PENPOT_API_URL
            - name: PENPOT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: penpot-mcp-credentials
                  key: PENPOT_ACCESS_TOKEN
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-mcp
  namespace: agents
spec:
  selector:
    app.kubernetes.io/name: penpot-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
