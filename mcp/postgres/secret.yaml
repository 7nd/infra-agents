# mcp_readonly — роль без прав на запись, заведена в postgres/init-configmap.yaml
# (закрывает DoD п.7). --access-mode=restricted на самом MCP-сервере — это
# вторая, а не единственная линия защиты.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-mcp-credentials
  namespace: agents
stringData:
  DATABASE_URI: postgresql://mcp_readonly:${postgres_mcp_readonly_password}@postgres.agents.svc.cluster.local:5432/agents
