# Кастомный образ (см. images/k8s-diag-mcp), собран через in-cluster
# BuildKit (не локальный docker build — локальная машина arm64, ноды
# кластера amd64) и запушен в приватный registry.${base_domain} вручную,
# одноразово, как и остальные кастомные образы этого стенда.
#
# serviceAccountName: k8s-diag-mcp — сам ServiceAccount и весь RBAC под
# него заведены НЕ здесь, а в unitum-demo-k8s-infra
# (infrastructure/apps/managed-stands/rbac.yaml + flux-rbac.yaml): именно
# тот репозиторий владеет namespace managed и flux-system, в которые
# выдаются права, так что и RBAC-объекты логично держать там. Здесь —
# только сам под, который тем ServiceAccount'ом пользуется.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-diag-mcp
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-diag-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-diag-mcp
    spec:
      nodeSelector:
        node-group: agents
      serviceAccountName: k8s-diag-mcp
      imagePullSecrets:
        - name: registry-pull-secret
      containers:
        - name: k8s-diag-mcp
          image: registry.${base_domain}/k8s-diag-mcp:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-diag-mcp
  namespace: agents
spec:
  selector:
    app.kubernetes.io/name: k8s-diag-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
