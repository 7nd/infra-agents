# Официальный образ data.forgejo.org/forgejo/runner:13. Кластер — k3s
# (containerd, не Docker) — на хосте физически нет /var/run/docker.sock,
# поэтому вариант "смонтировать хостовый docker socket в раннер" (как делают
# многие community docker-compose примеры) тут не работает: нужен docker:dind
# сайдкар со своим собственным демоном внутри пода (тот же подход, что в
# официальном docker-compose примере форджо-доков, только TCP вместо unix-
# сокета — сайдкары одного пода делят network namespace, поэтому localhost
# работает без общего volume под сокет).
#
# Регистрация — offline-режимом (`forgejo-runner register`, флаг помечен
# deprecated в CLI, но рабочий на v13): initContainer запускает её один раз
# (идемпотентно — пропускает, если .runner уже есть на PVC), используя общий
# с сервером секрет forgejo_actions_runner_secret (см. forgejo-runner/secret.yaml
# и README про `forgejo-cli actions register --secret` на стороне сервера).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      nodeSelector:
        node-group: agents
      initContainers:
        - name: register
          image: data.forgejo.org/forgejo/runner:13
          workingDir: /data
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -f /data/.runner ]; then
                echo "already registered, skipping"
                exit 0
              fi
              forgejo-runner register \
                --no-interactive \
                --instance "$INSTANCE" \
                --token "$TOKEN" \
                --name agents-runner \
                --labels "docker:docker://node:22-bookworm,ubuntu-latest:docker://node:22-bookworm"
          env:
            # Internal Service (forgejo-http:3000), не внешний
            # https://forgejo.agents.${base_domain}: раннер живёт в том же
            # namespace, внешний DNS/Cloudflare/TLS для этого вызова не нужны
            # (и Cloudflare Free Universal SSL их всё равно не покрывает —
            # см. penpot/ingress.yaml).
            - name: INSTANCE
              value: http://forgejo-http.agents.svc.cluster.local:3000
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-credentials
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-lib
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        - name: runner
          image: data.forgejo.org/forgejo/runner:13
          workingDir: /data
          command: ["forgejo-runner", "daemon"]
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: docker-lib
          emptyDir: {}
