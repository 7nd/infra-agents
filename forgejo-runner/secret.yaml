# forgejo_actions_runner_secret — я генерирую его сам заранее (не chicken-egg,
# в отличие от forgejo_bot_token/glitchtip_mcp_token): offline-регистрация
# раннера (`forgejo forgejo-cli actions register --secret ...`, см. README)
# позволяет самому выбрать значение секрета и один раз сообщить его серверу
# через kubectl exec, вместо того чтобы вычитывать сгенерированный сервером
# токен.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-credentials
  namespace: agents
stringData:
  token: ${forgejo_actions_runner_secret}
