# Отдельный Secret, а не литеральное значение env в statefulset.yaml — так
# пароль не попадает в открытом виде в спеку пода (kubectl get pod -o yaml
# читается по более широкому RBAC, чем get secrets). Тот же приём, что
# cloudflare-api-token в unitum-demo-k8s-infra.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: agents
stringData:
  password: ${postgres_admin_password}
  mcp-readonly-password: ${postgres_mcp_readonly_password}
