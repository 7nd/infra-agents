apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: penpot
  namespace: agents
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # Cloudflare Free Universal SSL покрывает только ${base_domain} и
    # *.${base_domain} (один уровень wildcard) — НЕ *.agents.${base_domain}
    # (второй уровень). Через Cloudflare-прокси клиент получает handshake
    # failure ещё на этапе TLS до origin (проверено и через прямой openssl
    # s_client на IP ingress-nginx с нужным SNI — там сертификат
    # *.agents.${base_domain} отдаётся корректно, и с внешнего клиента
    # напрямую на прокси-IP — падает именно на Cloudflare). Отключаем прокси
    # именно для этих записей — резолвятся напрямую на origin, TLS
    # терминируется на ingress-nginx тем же Let's Encrypt сертификатом.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: ${ingress_class}
  tls:
    - hosts:
        - penpot.agents.${base_domain}
      secretName: wildcard-agents-tls
  rules:
    - host: penpot.agents.${base_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: penpot-frontend
                port:
                  number: 8080
