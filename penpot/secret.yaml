apiVersion: v1
kind: Secret
metadata:
  name: penpot-credentials
  namespace: agents
stringData:
  PENPOT_SECRET_KEY: ${penpot_secret_key}
  PENPOT_DATABASE_URI: postgresql://postgres.agents.svc.cluster.local/penpot
  PENPOT_DATABASE_USERNAME: postgres
  PENPOT_DATABASE_PASSWORD: ${postgres_admin_password}
  PENPOT_REDIS_URI: redis://:${valkey_password}@valkey.agents.svc.cluster.local:6379/2
