# Forgejo bot-токен для ops-агента (forgejo_create_repo/get_file/put_file
# Code Tool ноды workflow "Ops agent — managed workloads") — раньше был
# захардкожен литералом в теле JS этих нод, что нарушает правило проекта
# "секреты только через SOPS, никогда plain-text в коде/манифестах" (см.
# WORKING-WITH-THIS-INFRA.md, п.3). Переиспользует УЖЕ существующий SOPS-
# ключ forgejo_bot_token (тот же токен, что forgejo-mcp), новый ключ в
# bootstrap/agents-secrets.yaml заводить не пришлось.
#
# Отдельный Secret, не переиспользуем agents-secrets напрямую — тот живёт
# в namespace flux-system (для postBuild.substituteFrom Kustomization) и
# недоступен как secretKeyRef поду n8n в namespace agents (secretKeyRef
# не работает через границу namespace).
apiVersion: v1
kind: Secret
metadata:
  name: n8n-forgejo-token
  namespace: agents
stringData:
  FORGEJO_BOT_TOKEN: ${forgejo_bot_token}
