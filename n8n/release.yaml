# community-charts/n8n (classic HelmRepository) — см. sources/helmrepositories.yaml
# про то, почему не 8gears/OCI. Один "main"-процесс (worker/webhook — по
# умолчанию у чарта их replicaCount 0/выключены — очередь не нужна для
# демо-нагрузки одного стенда). persistence чарта по умолчанию выключена —
# осознанно: n8n не входит в список stateful-компонентов DoD п.8, всё что
# должно пережить рестарт (workflow'ы, credentials, execution log) уходит в
# Postgres через db.type: postgresdb.
#
# LLM-креды (Anthropic/OpenRouter credential) сюда не заводятся значениями
# чарта — у n8n это создаётся через UI (credential entity, зашифрован
# N8N_ENCRYPTION_KEY и живёт в Postgres), а не через переменные окружения;
# ключ и Base URL придут от пользователя позже (см. README).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: agents
spec:
  interval: 30m
  chart:
    spec:
      chart: n8n
      version: "1.24.x"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    nodeSelector:
      node-group: agents
    existingEncryptionKeySecret: n8n-encryption-key
    db:
      type: postgresdb
    externalPostgresql:
      host: postgres.agents.svc.cluster.local
      port: 5432
      username: postgres
      database: n8n
      existingSecret: postgres-credentials
      existingSecretPasswordKey: password
    ingress:
      enabled: true
      className: ${ingress_class}
      annotations:
        # Cloudflare Free Universal SSL не покрывает *.agents.${base_domain}
        # (второй уровень wildcard) — см. penpot/ingress.yaml, тот же фикс.
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        # Дефолтный proxy-read/send-timeout ingress-nginx (60s) обрубает
        # синхронный вебхук чат-триггера ops-агента раньше, чем AI Agent
        # успевает пройти длинную цепочку tool-calls (создание репо + запись
        # нескольких файлов + reconcile) — клиент получал 504 от nginx, хотя
        # сама workflow либо ещё считала, либо вообще не успевала стартовать.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      hosts:
        - host: n8n.agents.${base_domain}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - n8n.agents.${base_domain}
          secretName: wildcard-agents-tls
    main:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
