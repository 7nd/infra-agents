# n8n и Forgejo публикуются как OCI-чарты (не classic HelmRepository) —
# тот же паттерн, что cert-manager в unitum-demo-k8s-infra
# (infrastructure/sources/ocirepositories.yaml там же).
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 1h
  url: oci://8gears.container-registry.com/library/n8n
  # Пин на точный тег, а не semver-диапазон: у semver-разрешения на этом
  # конкретном registry source-controller (v1.4.1) зависал в вечном
  # "building artifact" без ошибки и без логов — воспроизведено вживую при
  # первом деплое (forgejo/17.x, тот же source-controller, тот же паттерн —
  # отработал нормально, так что дело не в самом semver-механизме в целом).
  # Обновление версии — правка тега здесь, коммит.
  ref:
    tag: "2.1.1"
---
# appVersion дефолтного чарта тянет non-LTS ветку Forgejo (16.x) — сам образ
# пинуется явно на LTS в forgejo/release.yaml (values.image.tag), чарт здесь
# используется только как деплой-механизм.
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: forgejo
  namespace: flux-system
spec:
  interval: 1h
  url: oci://code.forgejo.org/forgejo-helm/forgejo
  ref:
    semver: "17.x"
